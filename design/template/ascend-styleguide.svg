<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <title>ascend – style guide v0.3</title>
  <!-- Flat palette, type and core components. Values match design/tokens.json. No gradients. -->

  <rect width="1440" height="900" fill="#FBFAF7"/>

  <g id="header">
    <text x="64" y="150" font-family="'Times New Roman', Times, serif" font-size="140" fill="#151A1B">a</text>
    <text x="160" y="104" font-family="'Times New Roman', Times, serif" font-size="40" fill="#151A1B">ascend</text>
    <text x="160" y="132" font-size="13" fill="#5A6264">Style guide v0.3 · flat colour · Times for display, SF Pro for interface</text>
  </g>
  <line x1="64" y1="190.5" x2="1376" y2="190.5" stroke="#DEDCD3"/>

  <!-- Palette: six colours, each with a job -->
  <g id="palette" font-size="12" style="font-variant-numeric: tabular-nums">
    <text x="64" y="230" font-size="12" font-weight="600" fill="#5A6264">Colour</text>
    <g transform="translate(64 248)">
      <rect width="196" height="120" fill="#F6F5F0" stroke="#DEDCD3"/>
      <text x="0" y="146" font-size="13" font-weight="600" fill="#151A1B">Paper</text>
      <text x="0" y="164" fill="#5A6264">#F6F5F0 · backgrounds</text>
    </g>
    <g transform="translate(284 248)">
      <rect width="196" height="120" fill="#151A1B"/>
      <text x="0" y="146" font-size="13" font-weight="600" fill="#151A1B">Ink</text>
      <text x="0" y="164" fill="#5A6264">#151A1B · text, primary · 16.1:1</text>
    </g>
    <g transform="translate(504 248)">
      <rect width="196" height="120" fill="#5A6264"/>
      <text x="0" y="146" font-size="13" font-weight="600" fill="#151A1B">Graphite</text>
      <text x="0" y="164" fill="#5A6264">#5A6264 · secondary text · 5.7:1</text>
    </g>
    <g transform="translate(724 248)">
      <rect width="196" height="120" fill="#DEDCD3"/>
      <text x="0" y="146" font-size="13" font-weight="600" fill="#151A1B">Rule</text>
      <text x="0" y="164" fill="#5A6264">#DEDCD3 · hairlines, borders</text>
    </g>
    <g transform="translate(944 248)">
      <rect width="196" height="120" fill="#A8DCD2"/>
      <text x="0" y="146" font-size="13" font-weight="600" fill="#151A1B">Mint</text>
      <text x="0" y="164" fill="#5A6264">#A8DCD2 · icon, selection</text>
    </g>
    <g transform="translate(1164 248)">
      <rect width="196" height="120" fill="#1E5C5E"/>
      <text x="0" y="146" font-size="13" font-weight="600" fill="#151A1B">Teal</text>
      <text x="0" y="164" fill="#5A6264">#1E5C5E · links, focus, secure · 7:1</text>
    </g>
  </g>

  <line x1="64" y1="460.5" x2="1376" y2="460.5" stroke="#DEDCD3"/>

  <!-- Type -->
  <g id="typography" fill="#151A1B">
    <text x="64" y="500" font-size="12" font-weight="600" fill="#5A6264">Type</text>
    <text x="64" y="560" font-family="'Times New Roman', Times, serif" font-size="48">Display 48, Times New Roman</text>
    <text x="64" y="606" font-family="'Times New Roman', Times, serif" font-size="28">Title 28, Times New Roman</text>
    <text x="64" y="644" font-size="15" font-weight="600">Heading 15, SF Pro semibold</text>
    <text x="64" y="672" font-size="13">Body 13, SF Pro: tab titles, menus, lists</text>
    <text x="64" y="696" font-size="12" fill="#5A6264">Caption 12, graphite: times, hints, status</text>
    <text x="64" y="720" font-size="12" font-family="'SF Mono', ui-monospace, Menlo, monospace" fill="#5A6264">Mono 12: example.com/path?q=1</text>
  </g>

  <!-- Components -->
  <g id="components" font-size="13">
    <text x="760" y="500" font-size="12" font-weight="600" fill="#5A6264">Components</text>

    <rect x="760" y="520" width="112" height="32" rx="6" fill="#151A1B"/>
    <text x="816" y="541" fill="#F6F5F0" font-weight="500" text-anchor="middle">Open Page</text>
    <rect x="884.5" y="520.5" width="112" height="31" rx="6" fill="#FFFFFF" stroke="#DEDCD3"/>
    <text x="940" y="541" fill="#151A1B" font-weight="500" text-anchor="middle">Cancel</text>
    <text x="1012" y="541" fill="#1E5C5E" font-weight="500">Clear History…</text>
    <text x="1132" y="541" fill="#A33A35" font-weight="500">Delete</text>

    <rect x="760" y="580" width="400" height="36" fill="#EFEDE6"/>
    <rect x="760" y="580" width="160" height="36" fill="#FBFAF7"/>
    <line x1="760.5" y1="580" x2="760.5" y2="616" stroke="#DEDCD3"/>
    <line x1="919.5" y1="580" x2="919.5" y2="616" stroke="#DEDCD3"/>
    <text x="776" y="603" fill="#151A1B" font-weight="500">Active tab</text>
    <text x="936" y="603" fill="#5A6264">Inactive tab</text>
    <text x="1060" y="603" fill="#5A6264">Loading…</text>

    <rect x="760.5" y="640.5" width="380" height="27" rx="6" fill="#FFFFFF" stroke="#DEDCD3"/>
    <rect x="773" y="652" width="10" height="8" rx="1.5" fill="#1E5C5E"/>
    <path d="M775 652 v-2 a3 3 0 0 1 6 0 v2" fill="none" stroke="#1E5C5E" stroke-width="1.5"/>
    <text x="792" y="659" font-size="13" fill="#151A1B">example.com<tspan fill="#5A6264">/docs</tspan></text>

    <rect x="760.5" y="680.5" width="380" height="27" rx="6" fill="#FFFFFF" stroke="#DEDCD3"/>
    <text x="774" y="699" font-size="13" fill="#8A5A12">Not secure</text>
    <text x="850" y="699" font-size="13" fill="#151A1B">http://example.org</text>

    <rect x="760.5" y="726.5" width="112" height="31" rx="6" fill="#FFFFFF" stroke="#DEDCD3"/>
    <rect x="757.5" y="723.5" width="118" height="37" rx="8.5" fill="none" stroke="#1E5C5E" stroke-width="2"/>
    <text x="816" y="747" fill="#151A1B" font-weight="500" text-anchor="middle">Focused</text>
  </g>
</svg>
