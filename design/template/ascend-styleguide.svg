<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <title>ascend – style guide</title>
  <!-- Colors, gradient, type scale and core components. Values match design/tokens.json. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74E3C2"/>
      <stop offset="0.5" stop-color="#2BB4C8"/>
      <stop offset="1" stop-color="#2275D6"/>
    </linearGradient>
    <linearGradient id="brandDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74E3C2"/>
      <stop offset="0.5" stop-color="#2BB4C8"/>
      <stop offset="1" stop-color="#2275D6"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1000" fill="#FFFFFF"/>

  <g id="header">
    <rect x="64" y="56" width="56" height="56" rx="13" fill="url(#brandDiag)"/>
    <polyline points="80.5,82 92,70.5 103.5,82" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.72" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="76,99 92,83 108,99" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="140" y="82" font-size="28" font-weight="600" fill="#141E24" letter-spacing="-0.5">ascend</text>
    <text x="140" y="106" font-size="13" fill="#56676F">Style guide · v0.1 · mint → blue</text>
  </g>

  <!-- Color ramps -->
  <g id="colors" font-size="11">
    <text x="64" y="168" font-size="11" font-weight="600" fill="#93A4AD" letter-spacing="0.6">MINT</text>
    <g transform="translate(64 180)">
      <rect x="0" width="140" height="64" rx="8" fill="#EAFBF5"/><text x="10" y="82" fill="#25333A">50 #EAFBF5</text>
      <rect x="152" width="140" height="64" rx="8" fill="#C9F5E6"/><text x="162" y="82" fill="#25333A">100 #C9F5E6</text>
      <rect x="304" width="140" height="64" rx="8" fill="#A3EED6"/><text x="314" y="82" fill="#25333A">200 #A3EED6</text>
      <rect x="456" width="140" height="64" rx="8" fill="#74E3C2"/><text x="466" y="82" fill="#25333A">300 #74E3C2</text>
      <rect x="608" width="140" height="64" rx="8" fill="#48D3AE"/><text x="618" y="82" fill="#25333A">400 #48D3AE</text>
      <rect x="760" width="140" height="64" rx="8" fill="#22BC98"/><text x="770" y="82" fill="#25333A">500 #22BC98 · accent</text>
      <rect x="912" width="140" height="64" rx="8" fill="#16977C"/><text x="922" y="82" fill="#25333A">600 #16977C · secure</text>
      <rect x="1064" width="140" height="64" rx="8" fill="#127862"/><text x="1074" y="82" fill="#25333A">700 #127862</text>
    </g>

    <text x="64" y="300" font-size="11" font-weight="600" fill="#93A4AD" letter-spacing="0.6">BLUE</text>
    <g transform="translate(64 312)">
      <rect x="0" width="140" height="64" rx="8" fill="#EAF4FD"/><text x="10" y="82" fill="#25333A">50 #EAF4FD</text>
      <rect x="152" width="140" height="64" rx="8" fill="#CDE5FA"/><text x="162" y="82" fill="#25333A">100 #CDE5FA</text>
      <rect x="304" width="140" height="64" rx="8" fill="#9DCBF5"/><text x="314" y="82" fill="#25333A">200 #9DCBF5</text>
      <rect x="456" width="140" height="64" rx="8" fill="#66ABEE"/><text x="466" y="82" fill="#25333A">300 #66ABEE</text>
      <rect x="608" width="140" height="64" rx="8" fill="#3A8EE6"/><text x="618" y="82" fill="#25333A">400 #3A8EE6</text>
      <rect x="760" width="140" height="64" rx="8" fill="#2275D6"/><text x="770" y="82" fill="#25333A">500 #2275D6 · strong</text>
      <rect x="912" width="140" height="64" rx="8" fill="#1A5DB2"/><text x="922" y="82" fill="#25333A">600 #1A5DB2</text>
      <rect x="1064" width="140" height="64" rx="8" fill="#16498A"/><text x="1074" y="82" fill="#25333A">700 #16498A</text>
    </g>

    <text x="64" y="432" font-size="11" font-weight="600" fill="#93A4AD" letter-spacing="0.6">NEUTRAL</text>
    <g transform="translate(64 444)">
      <rect x="0" width="140" height="64" rx="8" fill="#F5F8F9" stroke="#E9EFF1"/><text x="10" y="82" fill="#25333A">50 #F5F8F9</text>
      <rect x="152" width="140" height="64" rx="8" fill="#E9EFF1"/><text x="162" y="82" fill="#25333A">100 #E9EFF1</text>
      <rect x="304" width="140" height="64" rx="8" fill="#D5DFE3"/><text x="314" y="82" fill="#25333A">200 #D5DFE3</text>
      <rect x="456" width="140" height="64" rx="8" fill="#93A4AD"/><text x="466" y="82" fill="#25333A">400 #93A4AD</text>
      <rect x="608" width="140" height="64" rx="8" fill="#56676F"/><text x="618" y="82" fill="#25333A">600 #56676F</text>
      <rect x="760" width="140" height="64" rx="8" fill="#25333A"/><text x="770" y="82" fill="#25333A">800 #25333A</text>
      <rect x="912" width="140" height="64" rx="8" fill="#141E24"/><text x="922" y="82" fill="#25333A">900 #141E24 · text</text>
      <rect x="1064" width="140" height="64" rx="8" fill="#0C1418"/><text x="1074" y="82" fill="#25333A">950 #0C1418 · dark bg</text>
    </g>

    <text x="64" y="564" font-size="11" font-weight="600" fill="#93A4AD" letter-spacing="0.6">BRAND GRADIENT · 135°</text>
    <rect x="64" y="576" width="1204" height="48" rx="12" fill="url(#brand)"/>
    <text x="80" y="606" font-size="12" font-weight="500" fill="#127862">#74E3C2</text>
    <text x="666" y="606" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">#2BB4C8</text>
    <text x="1252" y="606" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="end">#2275D6</text>
  </g>

  <!-- Typography -->
  <g id="typography" fill="#141E24">
    <text x="64" y="680" font-size="11" font-weight="600" fill="#93A4AD" letter-spacing="0.6">TYPE · SF PRO (SYSTEM FONT, NO DOWNLOAD)</text>
    <text x="64" y="720" font-size="28" font-weight="600" letter-spacing="-0.5">Title 28 / semibold</text>
    <text x="64" y="754" font-size="20" font-weight="600">Heading 20 / semibold</text>
    <text x="64" y="782" font-size="15" font-weight="500">Body large 15 / medium</text>
    <text x="64" y="806" font-size="13">Body 13 / regular – tab titles, menus</text>
    <text x="64" y="828" font-size="12" fill="#56676F">Caption 12 / regular – secondary text</text>
    <text x="64" y="850" font-size="12" font-family="'SF Mono', ui-monospace, Menlo, monospace" fill="#56676F">Mono 12 – https://example.com/path</text>
  </g>

  <!-- Components -->
  <g id="components" font-size="13">
    <text x="640" y="680" font-size="11" font-weight="600" fill="#93A4AD" letter-spacing="0.6">BUTTONS</text>
    <rect x="640" y="696" width="120" height="34" rx="8" fill="url(#brandDiag)"/>
    <text x="700" y="718" fill="#FFFFFF" font-weight="600" text-anchor="middle">Primary</text>
    <rect x="776" y="696" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#D5DFE3"/>
    <text x="836" y="718" fill="#141E24" font-weight="500" text-anchor="middle">Secondary</text>
    <rect x="912" y="696" width="120" height="34" rx="8" fill="#EAFBF5"/>
    <text x="972" y="718" fill="#127862" font-weight="500" text-anchor="middle">Ghost</text>
    <rect x="1048" y="696" width="120" height="34" rx="8" fill="#FDECEC"/>
    <text x="1108" y="718" fill="#C2373C" font-weight="500" text-anchor="middle">Danger</text>

    <text x="640" y="766" font-size="11" font-weight="600" fill="#93A4AD" letter-spacing="0.6">TABS</text>
    <rect x="640" y="778" width="528" height="40" rx="8" fill="#E9EFF1"/>
    <path d="M648 818 V792 a6 6 0 0 1 6 -6 H830 a6 6 0 0 1 6 6 V818 Z" fill="#FFFFFF"/>
    <text x="664" y="808" fill="#141E24" font-weight="500">Active tab</text>
    <text x="852" y="808" fill="#56676F">Inactive tab</text>
    <text x="1020" y="808" fill="#93A4AD">Loading…</text>
    <circle cx="1006" cy="804" r="6" fill="none" stroke="#48D3AE" stroke-width="2" stroke-dasharray="20 18"/>

    <text x="640" y="854" font-size="11" font-weight="600" fill="#93A4AD" letter-spacing="0.6">ADDRESS BAR STATES</text>
    <rect x="640" y="866" width="258" height="30" rx="15" fill="#F5F8F9" stroke="#48D3AE" stroke-width="1.5"/>
    <rect x="654" y="878" width="10" height="8" rx="2" fill="#16977C"/>
    <path d="M656 878 v-2 a3 3 0 0 1 6 0 v2" fill="none" stroke="#16977C" stroke-width="1.6"/>
    <text x="672" y="886" font-size="12" fill="#141E24">example.com · HTTPS</text>
    <rect x="910" y="866" width="258" height="30" rx="15" fill="#FFF6E8" stroke="#E8A13A" stroke-width="1.5"/>
    <path d="M928 874 l6 11 h-12 Z" fill="#E8A13A"/>
    <text x="944" y="886" font-size="12" fill="#8A5A12">http only · blocked by default</text>

    <text x="640" y="940" font-size="11" font-weight="600" fill="#93A4AD" letter-spacing="0.6">FOCUS RING</text>
    <rect x="640" y="952" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#48D3AE" stroke-width="3"/>
    <text x="700" y="972" fill="#141E24" text-anchor="middle">Focused</text>
  </g>
</svg>
