<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <title>ascend – browser window template (light)</title>
  <!--
    Layout template for the ascend browser window, v0.3.
    Flat colours only (design/tokens.json): paper, ink, graphite, rule, mint,
    teal. No gradients. Each region is a named group so it imports as a layer.
  -->
  <defs>
    <clipPath id="windowClip"><rect x="40" y="40" width="1360" height="820" rx="10"/></clipPath>
    <filter id="windowShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect id="artboard-background" width="1440" height="900" fill="#E7E5DD"/>

  <g id="window" filter="url(#windowShadow)">
    <rect x="40" y="40" width="1360" height="820" rx="10" fill="#FBFAF7"/>
  </g>

  <g clip-path="url(#windowClip)">
    <!-- Tab strip -->
    <g id="tab-strip">
      <rect x="40" y="40" width="1360" height="44" fill="#EFEDE6"/>
      <line x1="40" y1="83.5" x2="1400" y2="83.5" stroke="#DEDCD3"/>
      <g id="traffic-lights">
        <circle cx="62" cy="62" r="6" fill="#FF5F57"/>
        <circle cx="82" cy="62" r="6" fill="#FEBC2E"/>
        <circle cx="102" cy="62" r="6" fill="#28C840"/>
      </g>
      <g id="tab-active">
        <rect x="160" y="40" width="230" height="44" fill="#FBFAF7"/>
        <line x1="160.5" y1="40" x2="160.5" y2="84" stroke="#DEDCD3"/>
        <line x1="389.5" y1="40" x2="389.5" y2="84" stroke="#DEDCD3"/>
        <rect x="176" y="54" width="16" height="16" rx="3.5" fill="#A8DCD2"/>
        <text x="184" y="67" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="15" fill="#151A1B">a</text>
        <text x="202" y="67" font-size="13" font-weight="500" fill="#151A1B">New Tab</text>
        <path d="M368 58 l8 8 M376 58 l-8 8" stroke="#5A6264" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <g id="tab-inactive">
        <rect x="406" y="55" width="14" height="14" rx="3" fill="none" stroke="#5A6264" stroke-width="1.2"/>
        <text x="430" y="67" font-size="13" fill="#5A6264">Example Domain</text>
        <line x1="619.5" y1="52" x2="619.5" y2="72" stroke="#DEDCD3"/>
      </g>
      <g id="tab-new">
        <path d="M638 62 h12 M644 56 v12" stroke="#5A6264" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Toolbar -->
    <g id="toolbar">
      <rect x="40" y="84" width="1360" height="44" fill="#FBFAF7"/>
      <line x1="40" y1="127.5" x2="1400" y2="127.5" stroke="#DEDCD3"/>
      <g id="nav-buttons" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
        <path d="M74 99 l-7 7 l7 7 M67 106 h14" stroke="#151A1B"/>
        <path d="M104 99 l7 7 l-7 7 M111 106 h-14" stroke="#B9B7AE"/>
        <path d="M148 100 a7 7 0 1 0 2 6 M148 95 v6 h-6" stroke="#151A1B"/>
      </g>
      <g id="address-bar">
        <rect x="176.5" y="92.5" width="1080" height="27" rx="6" fill="#FFFFFF" stroke="#DEDCD3"/>
        <g id="lock" transform="translate(189 98)">
          <rect x="0" y="6" width="10" height="8" rx="1.5" fill="#1E5C5E"/>
          <path d="M2 6 V4 a3 3 0 0 1 6 0 V6" fill="none" stroke="#1E5C5E" stroke-width="1.5"/>
        </g>
        <text x="208" y="110.5" font-size="13" fill="#151A1B">example.com<tspan fill="#5A6264">/</tspan></text>
      </g>
      <g id="blocker">
        <path d="M1286 97 l8 3 v5 c0 5 -3.5 8 -8 10 c-4.5 -2 -8 -5 -8 -10 v-5 Z" fill="none" stroke="#5A6264" stroke-width="1.5" stroke-linejoin="round"/>
        <text x="1300" y="110.5" font-size="12" fill="#5A6264" style="font-variant-numeric: tabular-nums">12</text>
      </g>
      <g id="menu" fill="#5A6264">
        <circle cx="1372" cy="100" r="1.6"/><circle cx="1372" cy="106" r="1.6"/><circle cx="1372" cy="112" r="1.6"/>
      </g>
    </g>

    <!-- Side panel rail -->
    <g id="side-rail">
      <rect x="40" y="128" width="48" height="732" fill="#EFEDE6"/>
      <line x1="87.5" y1="128" x2="87.5" y2="860" stroke="#DEDCD3"/>
      <rect x="40" y="146" width="2" height="28" fill="#1E5C5E"/>
      <g fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <g id="icon-history" stroke="#151A1B"><circle cx="64" cy="160" r="7"/><path d="M64 156 v4 l3 2"/></g>
        <g id="icon-bookmarks" stroke="#5A6264"><path d="M59 197 h10 v14 l-5 -4 l-5 4 Z"/></g>
        <g id="icon-notes" stroke="#5A6264"><rect x="58" y="234" width="12" height="15" rx="1.5"/><path d="M61 239 h6 M61 243 h6"/></g>
        <g id="icon-downloads" stroke="#5A6264"><path d="M64 274 v10 M59 280 l5 5 l5 -5 M58 289 h12"/></g>
        <g id="icon-settings" stroke="#5A6264"><circle cx="64" cy="834" r="3"/><circle cx="64" cy="834" r="7.5"/></g>
      </g>
    </g>

    <!-- Side panel: history -->
    <g id="side-panel" style="font-variant-numeric: tabular-nums">
      <rect x="88" y="128" width="264" height="732" fill="#FBFAF7"/>
      <line x1="351.5" y1="128" x2="351.5" y2="860" stroke="#DEDCD3"/>
      <text x="108" y="160" font-size="15" font-weight="600" fill="#151A1B">History</text>
      <rect x="108.5" y="174.5" width="223" height="27" rx="6" fill="#FFFFFF" stroke="#DEDCD3"/>
      <text x="119" y="192" font-size="12" fill="#5A6264">Search history…</text>

      <text x="108" y="232" font-size="12" font-weight="600" fill="#5A6264">Today</text>
      <g font-size="13">
        <text x="108" y="258" fill="#151A1B">Example Domain</text><text x="332" y="258" fill="#5A6264" font-size="12" text-anchor="end">14:32</text>
        <text x="108" y="284" fill="#151A1B">MDN Web Docs</text><text x="332" y="284" fill="#5A6264" font-size="12" text-anchor="end">13:05</text>
        <text x="108" y="310" fill="#151A1B">Electron Documentation</text><text x="332" y="310" fill="#5A6264" font-size="12" text-anchor="end">11:48</text>
      </g>
      <text x="108" y="348" font-size="12" font-weight="600" fill="#5A6264">Yesterday</text>
      <g font-size="13">
        <text x="108" y="374" fill="#151A1B">Wikipedia</text><text x="332" y="374" fill="#5A6264" font-size="12" text-anchor="end">21:10</text>
        <text x="108" y="400" fill="#151A1B">GitHub</text><text x="332" y="400" fill="#5A6264" font-size="12" text-anchor="end">18:22</text>
      </g>
      <text x="108" y="836" font-size="12" fill="#5A6264">Stored on this Mac only.</text>
    </g>

    <!-- Content: start page -->
    <g id="content-start-page" style="font-variant-numeric: tabular-nums">
      <rect x="352" y="128" width="1048" height="732" fill="#FBFAF7"/>
      <text id="start-mark" x="876" y="356" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="200" fill="#151A1B">a</text>

      <g id="start-address">
        <rect x="616.5" y="398.5" width="520" height="39" rx="7" fill="#FFFFFF" stroke="#DEDCD3"/>
        <text x="634" y="423" font-size="15" fill="#5A6264">Enter an address…</text>
      </g>

      <g id="recently-visited" font-size="13">
        <text x="616" y="498" font-size="12" font-weight="600" fill="#5A6264">Recently visited</text>
        <line x1="616" y1="510.5" x2="1136" y2="510.5" stroke="#DEDCD3"/>
        <text x="616" y="536" fill="#151A1B">Example Domain</text><text x="876" y="536" fill="#5A6264">example.com</text><text x="1136" y="536" fill="#5A6264" font-size="12" text-anchor="end">14:32</text>
        <line x1="616" y1="550.5" x2="1136" y2="550.5" stroke="#EAE8E1"/>
        <text x="616" y="576" fill="#151A1B">MDN Web Docs</text><text x="876" y="576" fill="#5A6264">developer.mozilla.org</text><text x="1136" y="576" fill="#5A6264" font-size="12" text-anchor="end">13:05</text>
        <line x1="616" y1="590.5" x2="1136" y2="590.5" stroke="#EAE8E1"/>
        <text x="616" y="616" fill="#151A1B">Electron Documentation</text><text x="876" y="616" fill="#5A6264">electronjs.org</text><text x="1136" y="616" fill="#5A6264" font-size="12" text-anchor="end">11:48</text>
        <line x1="616" y1="630.5" x2="1136" y2="630.5" stroke="#EAE8E1"/>
        <text x="616" y="656" fill="#151A1B">Wikipedia</text><text x="876" y="656" fill="#5A6264">wikipedia.org</text><text x="1136" y="656" fill="#5A6264" font-size="12" text-anchor="end">Yesterday</text>
      </g>
    </g>
  </g>
</svg>
