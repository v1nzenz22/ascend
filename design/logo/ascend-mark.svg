<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>ascend mark</title>
  <!--
    The lowercase Times New Roman "a" alone, for the start page, about box and
    README. PNG render: design/scripts/render-icon.swift.
  -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft">
        <feFuncA type="linear" slope="0" intercept="0.16"/>
      </feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="in" result="grainOnShape"/>
      <feBlend in="SourceGraphic" in2="grainOnShape" mode="overlay"/>
    </filter>
  </defs>
  <text x="256" y="380" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="520" fill="#1F5F8E" filter="url(#grain)">a</text>
</svg>
