<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ascend app icon</title>
  <!--
    Editable source of the app icon: a large lowercase Times New Roman "a" in
    ink on a flat mint tile, with film grain. No gradients.
    macOS Big Sur grid: 824 x 824 tile with a 100 px margin.
    The shipped PNG / .icns are rendered by design/scripts/render-icon.swift
    (exact glyph sizing and grain; sips ignores SVG filters).
  -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft">
        <feFuncA type="linear" slope="0" intercept="0.16"/>
      </feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="in" result="grainOnShape"/>
      <feBlend in="SourceGraphic" in2="grainOnShape" mode="overlay"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#A8DCD2"/>
    <text id="glyph" x="512" y="764" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="1080" fill="#151A1B">a</text>
  </g>
</svg>
