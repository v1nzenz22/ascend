<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ascend app icon</title>
  <!--
    Editable source of the app icon: a small lowercase Times New Roman "a"
    on a mint-to-blue tile with film grain. macOS Big Sur grid: 824 x 824
    tile with a 100 px margin.
    The shipped PNG / .icns are rendered by design/scripts/render-icon.swift,
    because sips ignores SVG filters (grain, shadow).
  -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9BE8CF"/>
      <stop offset="0.55" stop-color="#5CC4CF"/>
      <stop offset="1" stop-color="#3A82D6"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft">
        <feFuncA type="linear" slope="0" intercept="0.14"/>
      </feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="in" result="grainOnShape"/>
      <feBlend in="SourceGraphic" in2="grainOnShape" mode="overlay"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0C1418" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g id="tile" filter="url(#shadow)">
    <g filter="url(#grain)">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
      <text id="glyph" x="512" y="640" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="470" fill="#FBFAF6">a</text>
    </g>
  </g>
</svg>
