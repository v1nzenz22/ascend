<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ascend app icon</title>
  <!--
    macOS app icon (Big Sur+ grid): 1024 canvas, 824 x 824 rounded square
    centred with a 100 px margin, so the icon has the same optical size as
    system icons in the Dock. Two rising chevrons = "ascend".
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74E3C2"/>
      <stop offset="0.5" stop-color="#2BB4C8"/>
      <stop offset="1" stop-color="#2275D6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0C1418" flood-opacity="0.28"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16498A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="tile" filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#shine)"/>
  </g>

  <g id="glyph" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" filter="url(#glyphShadow)">
    <polyline id="chevron-upper" points="392,440 512,320 632,440" stroke-width="70" stroke="#D9F5F2"/>
    <polyline id="chevron-lower" points="322,688 512,498 702,688" stroke-width="92"/>
  </g>
</svg>
