<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ascend app icon</title>
  <!--
    Editable approximation of the app icon: an oversized white Times New Roman
    "a", cropped by a flat mint tile and pressed in with an inner shadow, plus
    grain. macOS Big Sur grid: 824 x 824 tile with a 100 px margin.
    The shipped PNG / .icns come from design/scripts/render-icon.swift, which
    sizes the glyph exactly (ink height 1080 px, centre 480 / 574 in SVG space).
  -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185" ry="185"/></clipPath>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dy="22" in="SourceAlpha" result="offset"/>
      <feGaussianBlur stdDeviation="17" in="offset" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="inverse"/>
      <feFlood flood-color="#0F3333" flood-opacity="0.45"/>
      <feComposite in2="inverse" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceAlpha" operator="in" result="inner"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="inner"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft"><feFuncA type="linear" slope="0" intercept="0.16"/></feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="in" result="grainOnShape"/>
      <feBlend in="SourceGraphic" in2="grainOnShape" mode="overlay"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)" filter="url(#grain)">
    <rect x="100" y="100" width="824" height="824" fill="#A8DCD2"/>
    <text id="glyph" x="480" y="1114" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="2340" fill="#FFFFFF" filter="url(#innerShadow)">a</text>
  </g>
</svg>
